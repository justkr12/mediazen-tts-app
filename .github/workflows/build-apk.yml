name: build-apk
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Read Gradle version from wrapper properties
        id: gv
        run: echo "v=$(sed -n 's#.*gradle-\(.*\)-bin\.zip#\1#p' tts_app/gradle/wrapper/gradle-wrapper.properties)" >> "$GITHUB_OUTPUT"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gv.outputs.v }}
      - name: Test dbPath layout rules
        run: python3 tts_app/tests/test_dbpath_layout.py
      - name: Test synthesis core
        run: |
          g++ -std=c++14 -Wall -Wextra -fsanitize=address,undefined \
            -Itts_app/app/src/main/cpp tts_app/tests/test_tts_core.cpp -o /tmp/test_tts_core
          /tmp/test_tts_core
      - name: Prepare Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > tts_app/local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "cmake;3.22.1"
      - name: Build debug APK
        working-directory: tts_app
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Verify native libs are packaged
        run: |
          APK=tts_app/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep "lib/armeabi-v7a/.*\.so"
          test "$(unzip -l "$APK" | grep -c 'lib/armeabi-v7a/.*\.so')" -ge 9
          test "$(unzip -l "$APK" | grep -c 'lib/arm64-v8a')" -eq 0
      - uses: actions/upload-artifact@v4
        with:
          name: tts-debug-apk
          path: tts_app/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-${GITHUB_RUN_NUMBER}"
          cp tts_app/app/build/outputs/apk/debug/app-debug.apk "mediazen-tts-${TAG}.apk"
          gh release create "$TAG" "mediazen-tts-${TAG}.apk" --prerelease --target "$GITHUB_SHA" --title "debug build ${GITHUB_RUN_NUMBER}" --notes "Debug APK built from ${GITHUB_SHA}"
