name: build-apk
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Read Gradle version from wrapper properties
        id: gv
        run: echo "v=$(sed -n 's#.*gradle-\(.*\)-bin\.zip#\1#p' tts_app/gradle/wrapper/gradle-wrapper.properties)" >> "$GITHUB_OUTPUT"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gv.outputs.v }}
      - name: Prepare Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > tts_app/local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "cmake;3.22.1"
      - name: Build debug APK
        working-directory: tts_app
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Verify native libs are packaged
        run: |
          APK=tts_app/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep "lib/armeabi-v7a/.*\.so"
          test "$(unzip -l "$APK" | grep -c 'lib/armeabi-v7a/.*\.so')" -ge 9
          test "$(unzip -l "$APK" | grep -c 'lib/arm64-v8a')" -eq 0
      - uses: actions/upload-artifact@v4
        with:
          name: tts-debug-apk
          path: tts_app/app/build/outputs/apk/debug/app-debug.apk
